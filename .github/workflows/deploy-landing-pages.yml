name: Deploy landing to GitHub Pages

on:
  push:
    branches:
      - cursor/initial-videodating-platform
      - main
      - master
    paths:
      - "web/**"
      - "scripts/build-landing-preview.sh"
      - ".github/workflows/deploy-landing-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: landing-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build landing preview
        run: ./scripts/build-landing-preview.sh

      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview-landing

      - id: deployment
        uses: actions/deploy-pages@v4
